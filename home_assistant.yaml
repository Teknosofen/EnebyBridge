# ─── Home Assistant integration for Eneby BT bridge ─────────────────────────
#
# Replace 192.168.1.44 with your Pi's actual IP address.
# Add these to your configuration.yaml (or split into separate files).
#

# ─── REST commands (send play/stop/volume to the Pi) ─────────────────────────
rest_command:
  eneby_play:
    url: "http://192.168.1.44/play"
    method: GET
    params:
      url: "{{ url }}"

  eneby_stop:
    url: "http://192.168.1.44/stop"
    method: GET

  eneby_volume:
    url: "http://192.168.1.44/volume"
    method: GET
    params:
      level: "{{ level }}"

# ─── Template media_player entity ────────────────────────────────────────────
# This gives you a proper media_player card in HA dashboards.
#
media_player:
  - platform: template
    media_players:
      eneby_speaker:
        unique_id: eneby_bt_bridge
        friendly_name: "Eneby Speaker"
        value_template: >
          {% set status = states('sensor.eneby_status') %}
          {% if status == 'playing' %}playing{% else %}idle{% endif %}
        turn_on:
          service: rest_command.eneby_play
          data:
            url: "https://sverigesradio.se/topsy/direkt/164-hi-mp3"
        turn_off:
          service: rest_command.eneby_stop
        set_volume:
          service: rest_command.eneby_volume
          data:
            level: "{{ (volume_level * 100) | int }}"
        volume_template: "{{ state_attr('sensor.eneby_status', 'volume') | default(70) | int / 100 }}"

# ─── REST sensor (polls /status for state) ───────────────────────────────────
sensor:
  - platform: rest
    name: eneby_status
    resource: "http://192.168.1.44/status"
    scan_interval: 10
    value_template: "{{ 'playing' if value_json.playing else 'idle' }}"
    json_attributes:
      - volume
      - url
      - bt_sink

# ─── Radio station selector ──────────────────────────────────────────────────
input_select:
  eneby_radio_station:
    name: Radiokanal
    options:
      - "Av"
      - "P1"
      - "P2"
      - "P3"
      - "P4 Stockholm"
      - "P4 Göteborg"
      - "RIX FM"
      - "Lugna Favoriter"
    initial: "Av"
    icon: mdi:radio

# ─── Automations ─────────────────────────────────────────────────────────────

automation:
  - alias: "Eneby - Play Selected Station"
    trigger:
      - platform: state
        entity_id: input_select.eneby_radio_station
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.eneby_radio_station
                state: "Av"
            sequence:
              - service: rest_command.eneby_stop
        default:
          - service: rest_command.eneby_play
            data:
              url: >
                {% set station = states('input_select.eneby_radio_station') %}
                {% set urls = {
                  'P1':              'https://sverigesradio.se/topsy/direkt/132-hi-mp3',
                  'P2':              'https://sverigesradio.se/topsy/direkt/2562-hi-mp3',
                  'P3':              'https://sverigesradio.se/topsy/direkt/164-hi-mp3',
                  'P4 Stockholm':    'https://sverigesradio.se/topsy/direkt/701-hi-mp3',
                  'P4 Göteborg':     'https://sverigesradio.se/topsy/direkt/212-hi-mp3',
                  'RIX FM':          'https://live-bauerse.sharp-stream.com/rixfm_mp3_128',
                  'Lugna Favoriter': 'https://live-bauerse.sharp-stream.com/lugnafavoriter_mp3_128'
                } %}
                {{ urls[station] }}

  - alias: "Eneby - Stop on Away"
    trigger:
      - platform: state
        entity_id: person.your_name
        to: "not_home"
    action:
      - service: rest_command.eneby_stop
      - service: input_select.select_option
        target:
          entity_id: input_select.eneby_radio_station
        data:
          option: "Av"

# ─── Script: play any URL from HA UI ─────────────────────────────────────────
script:
  play_on_eneby:
    alias: "Play URL on Eneby"
    fields:
      url:
        description: "Audio stream URL (MP3)"
        example: "http://stream.example.com/radio.mp3"
    sequence:
      - service: rest_command.eneby_play
        data:
          url: "{{ url }}"
