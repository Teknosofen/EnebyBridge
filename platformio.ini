[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
  https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.0
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.4
  https://github.com/pschatzmann/minimp3.git

lib_compat_mode = off

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv

build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; Force-enable the WiFi/BT coexistence scheduler — without this, the two
  ; stacks fight for the radio with no arbitration.
  -DCONFIG_SW_COEXIST_ENABLE=1
  -DCONFIG_ESP32_WIFI_SW_COEXIST_ENABLE=1
  ; Prevents ESP32-A2DP from auto-including AudioTools.h (which drags in WiFi.h
  ; in a context where it can't be resolved). We use A2DPStream from audio-tools
  ; instead, so this integration path isn't needed.
  -DA2DP_I2S_AUDIOTOOLS=0
  ; Larger A2DP buffers absorb timing jitter from the WiFi/BT coex scheduler.
  ; Tune down if you get heap allocation errors.
  -DA2DP_BUFFER_COUNT=8
  -DA2DP_BUFFER_SIZE=512
